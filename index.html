<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tic Tac Toe</title>
        <link rel="stylesheet" href="./Styles/style.css" />
    </head>
    <body>
        <div class="game">
            <div class="title">
                <div class="mainTitle"><span>X O</span> Game</div>
                <div class="hide" id="roundTitle">Round 1</div>
            </div>

            <div class="items">
                <div class="square" id="item1" onclick="game(this.id)"></div>
                <div class="square" id="item2" onclick="game(this.id)"></div>
                <div class="square" id="item3" onclick="game(this.id)"></div>

                <div class="square" id="item4" onclick="game(this.id)"></div>
                <div class="square" id="item5" onclick="game(this.id)"></div>
                <div class="square" id="item6" onclick="game(this.id)"></div>

                <div class="square" id="item7" onclick="game(this.id)"></div>
                <div class="square" id="item8" onclick="game(this.id)"></div>
                <div class="square" id="item9" onclick="game(this.id)"></div>
            </div>

            <div class="score">
                <div class="player1">
                    <span id="player1Label">Player X</span>:
                    <span id="player1">0</span>
                </div>

                <div class="player2">
                    <span id="player2Label">Player O</span>:
                    <span id="player2">0</span>
                </div>
            </div>

            <div class="modes">
                <button class="pvp" onclick="setMode('pvp')">Player vs Player</button>

                <button class="pvc" onclick="setMode('ai')">Player vs Computer</button>
            </div>

            <button class="reset">Reset Game</button>
        </div>

        <script src="./Js/script.js"></script>
    </body>
</html>
